# Everything that changes between experiments lives here, not in code.

[chunking]
strategy = "structure"        # "structure" (headings + blocks) or "fixed"
max_tokens = 350              # structure: upper bound per chunk
min_tokens = 60               # structure: smaller sections are merged into the next one
fixed_tokens = 300            # fixed: window size
fixed_overlap = 50            # fixed: overlap between windows

[dedup]
near_duplicate_jaccard = 0.5  # word 5-shingle overlap that flags two documents as near-duplicates

[embedding]
model = "BAAI/bge-small-en-v1.5"
compare_models = ["BAAI/bge-small-en-v1.5", "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"]

[retrieval]
mode = "hybrid_rerank"        # bm25 | vector | hybrid | hybrid_rerank
k = 5                         # chunks returned
candidates = 20               # per retriever before fusion / reranking
rrf_k = 60                    # reciprocal rank fusion constant
rerank_model = "Xenova/ms-marco-MiniLM-L-6-v2"

[rag]
model = "google/gemini-2.5-flash-lite"
prompt_version = "v2"
context_token_budget = 2000   # max tokens of retrieved text sent to the model
min_rerank_score = -4.0       # below this, the best chunk is treated as "nothing relevant": answer "not in the docs" without calling the model
temperature = 0.0
price_input = 0.10            # USD per 1M tokens
price_output = 0.40

[judge]
model = "openai/gpt-4.1-mini" # a different model family from the answer model, to avoid self-preference
correctness_prompt = "v1"
faithfulness_prompt = "v1"
price_input = 0.40
price_output = 1.60

[openrouter]
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
timeout_s = 60
max_retries = 3

# `make eval` exits with code 1 if any metric is below its threshold (this is what fails CI).
[eval.thresholds]
abstention_accuracy = 0.85
source_hit = 0.80
key_fact_recall = 0.70
citation_validity = 0.95
judge_correctness = 0.70
faithfulness = 0.85

[eval.retrieval_thresholds]  # production retrieval config on the answerable questions
recall_at_k = 0.75
mrr_at_10 = 0.65
