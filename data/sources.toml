# Corpus: Guesty public developer guides (Open API + Booking Engine API).
# The documents are not stored in this repo; `make fetch` downloads them into data/raw/.
#
# format = how the document enters the pipeline:
#   html  the live page as served (navigation, scripts, footer and all)
#   pdf   the live page printed to PDF by headless Chrome (browser header/footer, page breaks)
#   docx  the page's Markdown export converted to a Word document (heading styles, lists, tables)
# Default format is html.

